name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (all extras)
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check

      - name: Pytest (unit)
        run: uv run pytest -m "not integration"

      - name: Fresh-install startup smoke test
        run: timeout 180s uv run python scripts/verify_live.py --startup-only
